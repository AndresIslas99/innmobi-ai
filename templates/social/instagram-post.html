<!doctype html>
<!-- Innmobi.ai · Instagram post template (1080×1080)
     Slots: {{ EYEBROW }}, {{ HEADLINE }}, {{ PROOF }}
     Render con scripts/render-social.mjs (futuro) o screenshot manual a 1080×1080. -->
<html lang="es-MX">
<head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
:root { --ink-black:#0F0F10; --ink-700:#4A4A52; --ink-500:#7C7C82; --ink-200:#D4D2CB; --bone:#F2EFE9; --paper:#FEFCF7; --forest:#1F3A2D; --brass:#A77E2B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; background: var(--bone); font-family: 'Fraunces', serif; color: var(--ink-black); overflow: hidden; }
.frame { width: 1080px; height: 1080px; padding: 80px 90px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
.top, .bot { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.18em; color: var(--ink-500); text-transform: uppercase; }
.brassbar { height: 1px; background: var(--brass); opacity: 0.5; margin-top: 8px; }
.brassbar.b { margin-top: 0; margin-bottom: 8px; }
.eyebrow { color: var(--brass); }
.head { font-size: 84px; font-weight: 600; font-variation-settings: 'opsz' 144; line-height: 1.05; letter-spacing: -1.6px; max-width: 880px; }
em { font-style: italic; color: var(--forest); }
.proof { font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.12em; color: var(--ink-700); text-transform: uppercase; margin-top: 24px; }
.wm { font-size: 36px; font-weight: 600; }
.wm .p { color: var(--brass); }
</style></head>
<body>
<div class="frame">
  <div>
    <div class="top">
      <span class="eyebrow">{{ EYEBROW }}</span>
      <span>1080 × 1080</span>
    </div>
    <div class="brassbar"></div>
  </div>
  <div>
    <h1 class="head">{{ HEADLINE }}</h1>
    <p class="proof">{{ PROOF }}</p>
  </div>
  <div>
    <div class="brassbar b"></div>
    <div class="bot">
      <span class="wm">Innmobi<span class="p">.</span>ai</span>
      <span>INNMOBI.AI · CDMX 🇲🇽</span>
    </div>
  </div>
</div>
</body></html>
