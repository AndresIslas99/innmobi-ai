<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
<title>{{ title }}</title>
<meta name="description" content="{{ description }}"/>
<meta name="theme-color" content="#0F0F10"/>
<link rel="canonical" href="{{ siteUrl }}{{ canonicalPath }}"/>

<meta property="og:type" content="{{ ogType }}"/>
<meta property="og:title" content="{{ title }}"/>
<meta property="og:description" content="{{ description }}"/>
<meta property="og:image" content="{{ siteUrl }}{{ ogImage }}"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:url" content="{{ siteUrl }}{{ canonicalPath }}"/>
<meta property="og:site_name" content="Innmobi.ai"/>
<meta property="og:locale" content="es_MX"/>

<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{ title }}"/>
<meta name="twitter:description" content="{{ description }}"/>
<meta name="twitter:image" content="{{ siteUrl }}{{ ogImage }}"/>

<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/svg+xml" href="/assets/images/logo-innmobi-ai-icon.svg"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/css/styles.css"/>

<script defer data-domain="innmobi.ai" src="https://plausible.io/js/script.js"></script>
{{ extraHead }}
