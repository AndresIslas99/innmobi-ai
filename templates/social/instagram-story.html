<!doctype html>
<!-- Innmobi.ai · Instagram Story template (1080×1920) -->
<html lang="es-MX">
<head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
:root { --ink-black:#0F0F10; --ink-700:#4A4A52; --ink-500:#7C7C82; --bone:#F2EFE9; --paper:#FEFCF7; --forest:#1F3A2D; --brass:#A77E2B; --brass-soft:#C9A661; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: var(--ink-black); font-family: 'Fraunces', serif; color: var(--bone); overflow: hidden; }
.frame { width: 1080px; height: 1920px; padding: 120px 80px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
.top, .bot { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.18em; color: var(--brass-soft); text-transform: uppercase; }
.brassbar { height: 2px; background: var(--brass); opacity: 0.6; margin: 24px 0; }
.eyebrow { color: var(--brass-soft); }
.head { font-size: 110px; font-weight: 600; font-variation-settings: 'opsz' 144; line-height: 1.02; letter-spacing: -2px; }
em { font-style: italic; color: var(--brass-soft); }
.cta { font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.16em; color: var(--brass-soft); text-transform: uppercase; margin-top: 48px; padding: 16px 32px; border: 1px solid var(--brass); display: inline-block; }
.wm { font-size: 48px; font-weight: 600; color: var(--bone); }
.wm .p { color: var(--brass); }
</style></head>
<body>
<div class="frame">
  <div>
    <div class="top">
      <span class="eyebrow">{{ EYEBROW }}</span>
      <span>1080 × 1920</span>
    </div>
    <div class="brassbar"></div>
  </div>
  <div>
    <h1 class="head">{{ HEADLINE }}</h1>
    <span class="cta">{{ CTA }}</span>
  </div>
  <div>
    <div class="brassbar"></div>
    <div class="bot">
      <span class="wm">Innmobi<span class="p">.</span>ai</span>
      <span>CDMX 🇲🇽</span>
    </div>
  </div>
</div>
</body></html>
