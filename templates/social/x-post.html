<!doctype html>
<!-- Innmobi.ai · X (Twitter) post template (1600×900) -->
<html lang="es-MX">
<head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
:root { --ink-black:#0F0F10; --bone:#F2EFE9; --forest:#1F3A2D; --brass:#A77E2B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1600px; height: 900px; background: var(--bone); font-family: 'Fraunces', serif; color: var(--ink-black); overflow: hidden; }
.frame { width: 1600px; height: 900px; padding: 80px 100px; display: flex; flex-direction: column; justify-content: space-between; }
.top { font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.18em; color: #4A4A52; text-transform: uppercase; padding-bottom: 12px; border-bottom: 1px solid #D4D2CB; }
.eyebrow { color: var(--brass); }
.head { font-size: 96px; font-weight: 600; font-variation-settings: 'opsz' 144; line-height: 1.05; letter-spacing: -2px; max-width: 1400px; }
em { font-style: italic; color: var(--forest); }
.bot { display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.18em; color: #4A4A52; text-transform: uppercase; padding-top: 12px; border-top: 1px solid #D4D2CB; }
.wm { font-size: 40px; font-weight: 600; }
.wm .p { color: var(--brass); }
</style></head>
<body>
<div class="frame">
  <div class="top"><span class="eyebrow">{{ EYEBROW }}</span></div>
  <h1 class="head">{{ HEADLINE }}</h1>
  <div class="bot">
    <span class="wm">Innmobi<span class="p">.</span>ai</span>
    <span>INNMOBI.AI · CDMX 🇲🇽</span>
  </div>
</div>
</body></html>
