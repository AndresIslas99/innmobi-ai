name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'data/**'
      - 'images/**'
      - 'screenshots/**'
      - 'brochure/brochure.pdf'
      - 'scripts/build-site.mjs'
      - 'scripts/render-social-profiles.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refuse the placeholder agent id
        run: |
          set -e
          f=docs/assets/js/demo-en-vivo.js
          test -s "$f" || (echo "❌ Missing $f" && exit 1)
          if grep -n "agent_PENDING" "$f"; then
            echo "❌ $f still has the placeholder AGENT_ID. Put the id of the web agent there (apply_v6.py --channel=web) before the site can go out."
            exit 1
          fi
          echo "✓ AGENT_ID is not the placeholder"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Render social profiles (16 PNGs)
        run: node scripts/render-social-profiles.mjs

      - name: Build site
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
