name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build site
        run: node scripts/build-site.mjs

      - name: Check for stale brand references
        run: |
          set -e
          # screenshots/README.md mentions the old name intentionally (documents TODO).
          # .github/ is excluded because this workflow itself contains the search pattern.
          HITS=$(grep -rni "Inmobi\.ai\|INMOBI\.AI\|logo-inmobi-ai" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github . \
            | grep -v 'innmobi-ai-showcase' \
            | grep -v 'screenshots/README.md' \
            | grep -v 'docs/assets/screenshots/README.md' \
            || true)
          if [ -n "$HITS" ]; then
            echo "❌ Found stale brand references:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No stale brand references"

      - name: HTML lint (basic)
        run: |
          set -e
          for f in docs/index.html docs/producto/index.html docs/precios/index.html; do
            test -s "$f" || (echo "❌ Empty: $f" && exit 1)
            grep -q "<title>" "$f" || (echo "❌ Missing <title>: $f" && exit 1)
            grep -q "og:image" "$f" || (echo "❌ Missing og:image: $f" && exit 1)
            grep -q "Innmobi" "$f" || (echo "❌ Missing brand: $f" && exit 1)
          done
          echo "✓ HTML basics OK"

      - name: Verify sitemap and robots
        run: |
          test -s docs/sitemap.xml || (echo "❌ Missing sitemap" && exit 1)
          test -s docs/robots.txt || (echo "❌ Missing robots" && exit 1)
          test -s docs/CNAME || (echo "❌ Missing CNAME" && exit 1)
          test -s docs/manifest.webmanifest || (echo "❌ Missing manifest" && exit 1)
          test -s docs/favicon.ico || (echo "❌ Missing favicon.ico" && exit 1)
          echo "✓ Infrastructure files present"
