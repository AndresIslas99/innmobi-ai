<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Pipeline kanban con drag-and-drop">
  <defs>
    <style><![CDATA[
      .canvas { fill: #FEFCF7; }
      .canvas-frame { fill: none; stroke: #D4D2CB; stroke-width: 1; }
      .col-bg { fill: #F2EFE9; stroke: #D4D2CB; stroke-width: 1; }
      .col-h { font: 600 18px 'JetBrains Mono', monospace; fill: #4A4A52; letter-spacing: 2px; text-transform: uppercase; }
      .col-count { font: 600 18px 'JetBrains Mono', monospace; fill: #A77E2B; }
      .card { fill: #FEFCF7; stroke: #D4D2CB; stroke-width: 1; }
      .card-bar { fill: #1F3A2D; }
      .card-bar.hot { fill: #9A4521; }
      .card-bar.warm { fill: #A77E2B; }
      .card-name { font: 700 16px 'Inter', sans-serif; fill: #0F0F10; letter-spacing: -0.012em; }
      .card-meta { font: 500 12px 'JetBrains Mono', monospace; fill: #7C7C82; }
      .card-amt { font: 500 13px 'JetBrains Mono', monospace; fill: #A77E2B; }
      .marker { font: 500 13px 'JetBrains Mono', monospace; fill: #A77E2B; letter-spacing: 3px; text-transform: uppercase; }
      .h1 { font: 600 38px 'Fraunces', Georgia, serif; fill: #0F0F10; letter-spacing: -0.022em; }
      .h1 .accent { fill: #1F3A2D; }
      .h1 .period { fill: #A77E2B; }

      /* Cursor pointer */
      .cursor {
        animation: cursor-move 6s ease-in-out infinite;
      }
      @keyframes cursor-move {
        0%   { transform: translate(110px, 220px); opacity: 0; }
        10%  { transform: translate(135px, 245px); opacity: 1; }
        18%  { transform: translate(135px, 245px); opacity: 1; }  /* grab */
        45%  { transform: translate(545px, 245px); opacity: 1; }  /* moving */
        55%  { transform: translate(545px, 245px); opacity: 1; }  /* drop */
        65%  { transform: translate(560px, 290px); opacity: 1; }
        100% { transform: translate(110px, 220px); opacity: 0; }
      }

      /* Card moving: Carlos Méndez from Calificado → Cita */
      .draggable {
        animation: drag-card 6s ease-in-out infinite;
        filter: drop-shadow(0 0 0 transparent);
      }
      @keyframes drag-card {
        0%   { transform: translate(0, 0); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05)); }
        18%  { transform: translate(0, 0); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05)); }
        25%  { transform: translate(0, -10px); filter: drop-shadow(0 16px 30px rgba(15,15,16,0.18)); }
        45%  { transform: translate(410px, -10px); filter: drop-shadow(0 16px 30px rgba(15,15,16,0.18)); }
        55%  { transform: translate(410px, 0); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05)); }
        100% { transform: translate(410px, 0); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05)); }
      }

      /* Drop target highlight pulses */
      .drop-target {
        animation: pulse-border 6s ease-in-out infinite;
      }
      @keyframes pulse-border {
        0%, 18% { stroke: #D4D2CB; stroke-width: 1; }
        25%, 45% { stroke: #1F3A2D; stroke-width: 2; }
        55%, 100% { stroke: #D4D2CB; stroke-width: 1; }
      }

      /* Pipe header counter increments */
      .count-from { animation: count-tick 6s steps(1, end) infinite; }
      @keyframes count-tick {
        0%, 50%   { opacity: 1; content: '8'; }
        50.001%, 100% { opacity: 0.4; }
      }
    ]]></style>
  </defs>

  <!-- Canvas -->
  <rect class="canvas" width="1280" height="720"/>
  <rect class="canvas-frame" x="0.5" y="0.5" width="1279" height="719"/>

  <!-- Header -->
  <line x1="60" y1="56" x2="1220" y2="56" stroke="#A77E2B" stroke-width="1"/>
  <text x="60" y="80" class="marker">№ 02 — PIPELINE VISUAL</text>
  <text x="60" y="140" class="h1">Una pantalla. <tspan class="accent">Quince asesores</tspan><tspan class="period">.</tspan></text>

  <!-- 3 columns: Calificado / Cita / Oferta -->
  <g transform="translate(60, 200)">
    <!-- Column 1: Calificado -->
    <g>
      <rect class="col-bg" width="380" height="460" rx="2"/>
      <text x="20" y="32" class="col-h">CALIFICADO</text>
      <text x="160" y="32" class="col-h" style="letter-spacing: 0;"> ·</text>
      <text x="172" y="32" class="col-count">7</text>

      <!-- Static cards in column 1 -->
      <g transform="translate(20, 60)">
        <rect class="card" width="340" height="76" rx="2"/>
        <rect class="card-bar warm" x="0" y="0" width="3" height="76"/>
        <text x="18" y="28" class="card-name">Patricia Ruiz</text>
        <text x="18" y="50" class="card-meta">Coyoacán · Voz IA</text>
        <text x="320" y="50" class="card-amt" text-anchor="end">$3.8M</text>
      </g>

      <g transform="translate(20, 152)">
        <rect class="card" width="340" height="76" rx="2"/>
        <rect class="card-bar warm" x="0" y="0" width="3" height="76"/>
        <text x="18" y="28" class="card-name">Jorge Salinas</text>
        <text x="18" y="50" class="card-meta">Roma Norte · WhatsApp</text>
        <text x="320" y="50" class="card-amt" text-anchor="end">$5.1M</text>
      </g>
    </g>

    <!-- Column 2: Cita (drop target) -->
    <g transform="translate(410, 0)">
      <rect class="col-bg drop-target" width="380" height="460" rx="2"/>
      <text x="20" y="32" class="col-h">CITA</text>
      <text x="80" y="32" class="col-h" style="letter-spacing: 0;"> ·</text>
      <text x="92" y="32" class="col-count">5</text>

      <g transform="translate(20, 60)">
        <rect class="card" width="340" height="76" rx="2"/>
        <rect class="card-bar hot" x="0" y="0" width="3" height="76"/>
        <text x="18" y="28" class="card-name">Mariana López</text>
        <text x="18" y="50" class="card-meta">Polanco · Voz IA</text>
        <text x="320" y="50" class="card-amt" text-anchor="end">$9.0M</text>
      </g>

      <g transform="translate(20, 152)">
        <rect class="card" width="340" height="76" rx="2"/>
        <rect class="card-bar warm" x="0" y="0" width="3" height="76"/>
        <text x="18" y="28" class="card-name">Roberto Castro</text>
        <text x="18" y="50" class="card-meta">Condesa · Web</text>
        <text x="320" y="50" class="card-amt" text-anchor="end">$4.5M</text>
      </g>
    </g>

    <!-- Column 3: Oferta -->
    <g transform="translate(820, 0)">
      <rect class="col-bg" width="380" height="460" rx="2"/>
      <text x="20" y="32" class="col-h">OFERTA</text>
      <text x="100" y="32" class="col-h" style="letter-spacing: 0;"> ·</text>
      <text x="112" y="32" class="col-count">3</text>

      <g transform="translate(20, 60)">
        <rect class="card" width="340" height="76" rx="2"/>
        <rect class="card-bar hot" x="0" y="0" width="3" height="76"/>
        <text x="18" y="28" class="card-name">Sofía Hernández</text>
        <text x="18" y="50" class="card-meta">Narvarte · Voz IA</text>
        <text x="320" y="50" class="card-amt" text-anchor="end">$3.5M</text>
      </g>
    </g>

    <!-- ANIMATED CARD: Carlos Méndez moving from col 1 → col 2 -->
    <g class="draggable" transform="translate(0, 0)">
      <g transform="translate(20, 244)">
        <rect class="card" width="340" height="76" rx="2"/>
        <rect class="card-bar hot" x="0" y="0" width="3" height="76"/>
        <text x="18" y="28" class="card-name">Carlos Méndez</text>
        <text x="18" y="50" class="card-meta">🔥 HOT · Coyoacán · Voz IA</text>
        <text x="320" y="50" class="card-amt" text-anchor="end">$4.2M</text>
      </g>
    </g>
  </g>

  <!-- Cursor pointer (animated) -->
  <g class="cursor">
    <path d="M0 0 L0 16 L4 12 L7 18 L9 17 L6 11 L11 11 Z" fill="#0F0F10" stroke="#FEFCF7" stroke-width="1"/>
  </g>
</svg>
